name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minecraftskins
          POSTGRES_PASSWORD: minecraftskins
          POSTGRES_DB: minecraftskins
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minecraftskins -d minecraftskins"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://minecraftskins:minecraftskins@localhost:5432/minecraftskins?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить форматирование
        run: test -z "$(gofmt -l .)"
      - name: Установить Goose и применить миграции
        run: |
          curl -fsSL https://github.com/pressly/goose/releases/download/v3.28.0/goose_linux_x86_64 -o /usr/local/bin/goose
          chmod 0755 /usr/local/bin/goose
          goose -dir migrations postgres "$TEST_DATABASE_URL" up
      - name: go vet
        run: go vet ./...
      - name: Тесты с проверкой гонок
        run: go test -race ./...
      - name: Собрать API
        run: go build -o /tmp/minecraftskins-api ./cmd/api
      - name: Собрать runtime-образ
        run: docker build --target runtime -t minecraftskins-api:ci .
