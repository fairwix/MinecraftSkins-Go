services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minecraftskins}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minecraftskins}
      POSTGRES_DB: ${POSTGRES_DB:-minecraftskins}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minecraftskins} -d ${POSTGRES_DB:-minecraftskins}"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: goose
    depends_on:
      db:
        condition: service_healthy
    command:
      - -dir
      - /migrations
      - postgres
      - postgres://${POSTGRES_USER:-minecraftskins}:${POSTGRES_PASSWORD:-minecraftskins}@db:5432/${POSTGRES_DB:-minecraftskins}?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-minecraftskins}:${POSTGRES_PASSWORD:-minecraftskins}@db:5432/${POSTGRES_DB:-minecraftskins}?sslmode=disable
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3/}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      DEMO_USER_API_KEY: ${DEMO_USER_API_KEY:?Set DEMO_USER_API_KEY in .env}
      DEMO_USER_ID: ${DEMO_USER_ID:-demo-user}
      INSTANCE_ID: api-1
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
